name: Nightly AgencyForm Tests (3 Fixed Groups)

'on':
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  BASE_URL: ${{ vars.BASE_URL }}
  DTP_ROOT_URL: ${{ vars.DTP_ROOT_URL }}
  E2E_TEST_USER_EMAIL: ${{ vars.E2E_TEST_USER_EMAIL }}
  E2E_LOGIN_PROVIDER: MYID
  E2E_QDI_PASSWORD: ${{ secrets.E2E_QDI_PASSWORD }}
  E2E_QDI_OTP_CODE: ${{ secrets.E2E_QDI_OTP_CODE }}
  E2E_TEST_RUNNER_PASSWORD: ${{ secrets.E2E_TEST_RUNNER_PASSWORD }}
  E2E_SUBSCRIBER_CLIENT_SECRET: ${{ secrets.E2E_SUBSCRIBER_CLIENT_SECRET }}

jobs:
  agencyform-fixed-group-1:
    name: AgencyForm Fixed Group 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: e2e
    env:
      TEST_GROUP: fixed-group-1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify package managers
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Validate required environment variables
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          for key in DTP_ROOT_URL; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required variable: $key"
              missing=1
            fi
          done

          if [ -z "${E2E_LOGIN_EMAIL:-}" ] && [ -z "${E2E_MYID_EMAIL:-}" ] && [ -z "${E2E_TEST_USER_EMAIL:-}" ]; then
            echo "Missing login email configuration: set one of E2E_LOGIN_EMAIL, E2E_MYID_EMAIL, or E2E_TEST_USER_EMAIL"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run AgencyForm Fixed Group 1 tests
        run: |
          npx playwright test --project=chromium \
            "src/tests/AgencyForm/CC Apply/BYSMandatoryCheck.spec.ts" \
            "src/tests/AgencyForm/CC Apply/ApplicantMyselfMandatoryCheck.spec.ts" \
            "src/tests/AgencyForm/CC Apply/ApplicantNS.spec.ts" \
            "src/tests/AgencyForm/CC Apply/ApplicantParentMandatoryCheck.spec.ts" \
            "src/tests/AgencyForm/CC Apply/MyselfApplicant.spec.ts" \
            "src/tests/AgencyForm/CC Apply/ParentApplicant.spec.ts"

      - name: Upload Group 1 artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: agencyform-fixed-group-1-artifacts
          path: |
            e2e/playwright-report/**
            e2e/test-results/**
            playwright-report/**
            test-results/**
          if-no-files-found: ignore
          retention-days: 14

