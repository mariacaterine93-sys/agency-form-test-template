name: Nightly AgencyForm Tests (3 Groups)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  BASE_URL: ${{ vars.BASE_URL }}
  DTP_ROOT_URL: ${{ vars.DTP_ROOT_URL }}
  E2E_TEST_USER_EMAIL: ${{ vars.E2E_TEST_USER_EMAIL }}
  E2E_MYID_EMAIL: ${{ secrets.E2E_MYID_EMAIL }}
  E2E_LOGIN_PROVIDER: ${{ vars.E2E_LOGIN_PROVIDER }}
  E2E_LOGIN_EMAIL: ${{ vars.E2E_LOGIN_EMAIL }}
  E2E_QDI_PASSWORD: ${{ secrets.E2E_QDI_PASSWORD }}
  E2E_QDI_OTP_CODE: ${{ secrets.E2E_QDI_OTP_CODE }}
  E2E_TEST_RUNNER_PASSWORD: ${{ secrets.E2E_TEST_RUNNER_PASSWORD }}
  E2E_SUBSCRIBER_CLIENT_SECRET: ${{ secrets.E2E_SUBSCRIBER_CLIENT_SECRET }}

jobs:
  agencyform-group-1:
    name: AgencyForm Group 1 of 3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_GROUP: group-1
      TEST_SHARD: 1/3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Validate required environment variables
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in DTP_ROOT_URL; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required variable: $key"
              missing=1
            fi
          done

          if [ -z "${E2E_LOGIN_EMAIL:-}" ] && [ -z "${E2E_MYID_EMAIL:-}" ] && [ -z "${E2E_TEST_USER_EMAIL:-}" ]; then
            echo "Missing login email configuration: set one of E2E_LOGIN_EMAIL, E2E_MYID_EMAIL, or E2E_TEST_USER_EMAIL"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run AgencyForm Group 1 (shard 1/3)
        run: npx playwright test src/tests/AgencyForm --shard=1/3

      - name: Upload Group 1 test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agencyform-group-1-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  agencyform-group-2:
    name: AgencyForm Group 2 of 3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_GROUP: group-2
      TEST_SHARD: 2/3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Validate required environment variables
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in DTP_ROOT_URL; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required variable: $key"
              missing=1
            fi
          done

          if [ -z "${E2E_LOGIN_EMAIL:-}" ] && [ -z "${E2E_MYID_EMAIL:-}" ] && [ -z "${E2E_TEST_USER_EMAIL:-}" ]; then
            echo "Missing login email configuration: set one of E2E_LOGIN_EMAIL, E2E_MYID_EMAIL, or E2E_TEST_USER_EMAIL"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run AgencyForm Group 2 (shard 2/3)
        run: npx playwright test src/tests/AgencyForm --shard=2/3

      - name: Upload Group 2 test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agencyform-group-2-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  agencyform-group-3:
    name: AgencyForm Group 3 of 3
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TEST_GROUP: group-3
      TEST_SHARD: 3/3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Validate required environment variables
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in DTP_ROOT_URL; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required variable: $key"
              missing=1
            fi
          done

          if [ -z "${E2E_LOGIN_EMAIL:-}" ] && [ -z "${E2E_MYID_EMAIL:-}" ] && [ -z "${E2E_TEST_USER_EMAIL:-}" ]; then
            echo "Missing login email configuration: set one of E2E_LOGIN_EMAIL, E2E_MYID_EMAIL, or E2E_TEST_USER_EMAIL"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run AgencyForm Group 3 (shard 3/3)
        run: npx playwright test src/tests/AgencyForm --shard=3/3

      - name: Upload Group 3 test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agencyform-group-3-artifacts
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
